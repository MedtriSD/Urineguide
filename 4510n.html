    const errorGrid = document.getElementById('errorGrid');
    const searchInput = document.getElementById('searchInput');

    function formatSMValue(val) {
        if (!val || val.trim() === "" || val.toUpperCase() === "N/A" || val === "None.") {
            return '<span class="no-data">N/A (No Data)</span>';
        }
        return val;
    }

    function createManualDetailList(code) {
        const sm = smDataOriginal[code];
        const displayData = sm || {
            id: code,
            scenario: "N/A",
            name: rawErrors.find(r => r[0] === code)?.[1] || "N/A",
            msg: "N/A",
            instr: "N/A",
            detected: "N/A",
            timing: "N/A",
            cause: "N/A",
            add: "N/A",
            other: "N/A",
            clear: "N/A",
            after: "N/A",
            checkpoints: "N/A"
        };

        const fields = [
            { label: "Identification No.", value: displayData.id, icon: "fa-id-badge" },
            { label: "Scenario", value: displayData.scenario, icon: "fa-history" },
            { label: "Error name", value: displayData.name, icon: "fa-exclamation-circle" },
            { label: "Error message to the user", value: displayData.msg, icon: "fa-user-tag" },
            { label: "Message of instruction to the user", value: displayData.instr, icon: "fa-bullhorn" },
            { label: "Detected by", value: displayData.detected, icon: "fa-search" },
            { label: "Detection timing", value: displayData.timing, icon: "fa-stopwatch" },
            { label: "Cause", value: displayData.cause, icon: "fa-bug" },
            { label: "Additional data", value: displayData.add, icon: "fa-file-medical" },
            { label: "Other data", value: displayData.other, icon: "fa-clipboard-list" },
            { label: "User operations to clear error", value: displayData.clear, icon: "fa-magic" },
            { label: "User operations after clearing the error and returning to stand-by", value: displayData.after, icon: "fa-vial" },
            { label: "Checkpoints for service engineers", value: displayData.checkpoints, icon: "fa-wrench" }
        ];

        return fields.map(f => `
            <div class="sm-item">
                <span class="sm-label">
                    <i class="fas ${f.icon}"></i> ${f.label}
                </span>
                <div class="sm-value">${formatSMValue(f.value)}</div>
            </div>
        `).join('');
    }

    function renderCards(filter = '') {
        errorGrid.innerHTML = '';
        const filtered = rawErrors.filter(err => 
            err[0].includes(filter) || 
            err[1].toLowerCase().includes(filter.toLowerCase()) || 
            err[2].includes(filter)
        );

        filtered.forEach(err => {
            const detailId = `detail-${err[0]}`;
            const manualId = `manual-${err[0]}`;
            const card = document.createElement('div');
            card.className = 'error-card';
            card.onclick = () => toggleDetail(detailId);
            
            card.innerHTML = `
                <div class="card-header">
                    <span class="error-code">CODE ${err[0]}</span>
                    <i class="fas fa-chevron-right" style="color:#d1d5db; font-size:0.8rem"></i>
                </div>
                <div class="card-body">
                    <h2 class="error-title">${err[2]}</h2>
                    <p class="error-sub">${err[1]}</p>
                    <div class="info-row">
                        <span class="label"><i class="fas fa-exclamation-circle"></i> 故障情境 (Scenario)</span>
                        <div style="font-size:0.9rem">${err[1]}</div>
                    </div>
                    <div class="info-row">
                        <span class="label">可能原因</span>
                        <div style="font-size:0.9rem">${err[3]}</div>
                    </div>
                    <div class="info-row">
                        <span class="label"><i class="fas fa-comment-medical"></i> 醫檢師建議處置</span>
                        <div class="action-text">${err[4]}</div>
                    </div>
                </div>
                <div class="card-detail" id="${detailId}" onclick="event.stopPropagation()">
                    <div class="info-item">
                        <span class="label">Service Manual 描述</span>
                        <div style="font-size:0.9rem">${err[5]}</div>
                    </div>
                    <div class="engineer-box">
                        <span class="label"><i class="fas fa-tools"></i> 工程師技術動作</span>
                        <div style="font-size:0.9rem; color:#9A3412">${err[6]}</div>
                    </div>

                    <button class="manual-toggle-btn" onclick="toggleManual(event, '${err[0]}')">
                        <i class="fas fa-file-medical-alt"></i>
                        <span>詳細維修資訊 (Service Manual 原文)</span>
                        <i class="fas fa-chevron-down ml-auto"></i>
                    </button>
                    <div class="service-manual-detail" id="${manualId}">
                        ${createManualDetailList(err[0])}
                    </div>
                </div>
            `;
            errorGrid.appendChild(card);
        });
    }

    function toggleDetail(id) {
        const el = document.getElementById(id);
        const isOpen = el.style.display === 'block';
        el.style.display = isOpen ? 'none' : 'block';
    }

    function toggleManual(e, code) {
        e.stopPropagation();
        const manual = document.getElementById(`manual-${code}`);
        const btn = e.currentTarget;
        const icon = btn.querySelector('.fa-chevron-down');
        
        const isShow = manual.classList.toggle('show');
        if(icon) icon.style.transform = isShow ? 'rotate(180deg)' : 'rotate(0deg)';
    }

    searchInput.addEventListener('input', (e) => renderCards(e.target.value));
    window.onload = () => renderCards();
</script>

</body>
</html>
