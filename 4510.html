const fullErrors = [];
for (let i = 1; i <= 81; i++) {
    const codeStr = i.toString();
    const found = rawErrors.find(e => e[0] === codeStr);
    if (found) {
        fullErrors.push({ code: found[0], en: found[1], zh: found[2], cause: found[3], action: found[4], manual: found[5], engineer: found[6] });
    } else {
        // 針對沒提到的代碼，顯示基礎通訊/硬體檢查資訊
        fullErrors.push({
            code: codeStr,
            en: "System internal communication error " + codeStr,
            zh: "系統內部錯誤 " + codeStr,
            cause: "硬體板端通訊異常",
            action: "請關閉主機電源，靜置 10 秒後重新開啟",
            manual: "內部指令執行逾時 (參考 SM 8.1 列表)",

        });
    }
}

const errorGrid = document.getElementById('errorGrid');
const searchInput = document.getElementById('searchInput');
const resultCount = document.getElementById('resultCount');

function render(data) {
    errorGrid.innerHTML = '';
    resultCount.innerText = `目前顯示 ${data.length} 筆結果`;

    if (data.length === 0) {
        errorGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px; color:#94A3B8;">
            <i class="fas fa-search" style="font-size:3rem; margin-bottom:15px;"></i>
            <p>找不到符合 "${searchInput.value}" 的錯誤訊息</p>
        </div>`;
        return;
    }

    data.forEach(err => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => {
            const detail = card.querySelector('.card-detail');
            detail.style.display = detail.style.display === 'block' ? 'none' : 'block';
        };

        card.innerHTML = `
            <div class="card-head">
                <span class="err-code">CODE ${err.code}</span>
                <div class="card-title-zh">${err.zh}</div>
                <div class="card-title-en">${err.en}</div>
            </div>
            <div class="card-body">
                <div class="info-item">
                    <span class="label"><i class="fas fa-question-circle"></i> 可能成因</span>
                    <div>${err.cause}</div>
                </div>
                <div class="info-item">
                    <span class="label"><i class="fas fa-first-aid"></i> 醫檢師建議處置</span>
                    <div class="action-text">${err.action}</div>
                </div>
            </div>
            <div class="card-detail">
                <div class="info-item">
                    <span class="label">Service Manual 描述</span>
                    <div style="font-size:0.9rem;">${err.manual}</div>
                </div>
                <div class="engineer-box">
                    <span class="label"><i class="fas fa-tools"></i> 工程師技術動作</span>
                    <div style="font-size:0.9rem; color:#9A3412;">${err.engineer}</div>
                </div>
            </div>
        `;
        errorGrid.appendChild(card);
    });
}

// 支援代碼、中文、原文訊息(英文)、成因的關鍵字搜尋
searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase().trim();
    const filtered = fullErrors.filter(err => 
        err.code.includes(term) || 
        err.zh.toLowerCase().includes(term) || 
        err.en.toLowerCase().includes(term) ||
        err.cause.toLowerCase().includes(term)
    );
    render(filtered);
});

// 初次載入
render(fullErrors);
</script>
